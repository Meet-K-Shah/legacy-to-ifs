[project]
name = "ifs-migration"
version = "1.0.0"
description = "Multi-BU ERP migration & master-data governance engine (SYSPRO + Syteline -> IFS Cloud)"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "polars>=1.0", "pyarrow>=15", "rapidfuzz>=3.0", "pandas>=2.0", "streamlit>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
